<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afiaa Succulents</title>
  <style>
    :root {
      --bg: #f4f7f4;
      --card-bg: #ffffff;
      --primary: #2d5a3f;
      --primary-hover: #224430;
      --text-main: #1f2937;
      --text-sub: #4b5563;
      --border: #e5e7eb;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .avatar-wrapper {
      width: 84px;
      height: 84px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #e2ede5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      box-shadow: var(--shadow);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    p {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
    }

    /* Primary: Earthborn Store */
    .btn-earthborn {
      background-color: var(--primary);
      color: #ffffff;
      border: 1px solid var(--primary);
    }

    .btn-earthborn:hover, .btn-earthborn:active {
      background-color: var(--primary-hover);
    }

    /* Social Buttons */
    .btn-social {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-social:hover, .btn-social:active {
      border-color: #cbd5e1;
      background-color: #fafbfa;
    }

    .icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 32px;
      font-size: 0.75rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="avatar-wrapper">
      <svg class="icon" style="width: 40px; height: 40px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12A10 10 0 0 1 12 2Z"/>
        <path d="M12 6v12"/>
        <path d="M8 10c2-2 4-2 4 2"/>
        <path d="M16 14c-2 2-4 2-4-2"/>
      </svg>
    </div>

    <h1>Afiaa Succulents</h1>
    <p>Grower & Specialist</p>

    <div class="links">
      <!-- 1. Earthborn Online Store -->
      <a href="https://earthborn.africa/grower/afiaa-succulants/" class="btn btn-earthborn" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
          <path d="M3 6h18"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        Shop on Earthborn Africa
      </a>

      <!-- 2. Instagram -->
      <a href="https://www.instagram.com/afiaasucculents/" class="btn btn-social" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#E1306C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
          <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
        </svg>
        Follow on Instagram
      </a>

      <!-- 3. Facebook -->
      <a href="https://www.facebook.com/profile.php?id=61587484667480" class="btn btn-social" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#1877F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
        </svg>
        Connect on Facebook
      </a>
    </div>

    <div class="footer">
      Afiaa Succulents &bull; Cape Town
    </div>
  </div>

</body>
</html>
